<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarValuator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="shell">

    <header class="topbar">
        <span class="topbar-name">CarValuator</span>
    </header>

    <main>
        <!-- Hero input -->
        <section class="hero">
            <h1>What's your car worth?</h1>
            <p class="hero-sub">Enter your registration number and odometer. We check live listings and calculate a fair range.</p>

            <div class="input-stack">
                <label class="label" for="rc-number">Registration number</label>
                <div class="plate" id="plate-wrap">
                    <div class="plate-badge">
                        <span class="plate-badge-emblem">★</span>
                        <span class="plate-badge-country">IND</span>
                    </div>
                    <input id="rc-number" class="plate-field" type="text" placeholder="KA 01 AB 1234" maxlength="13" autocomplete="off" spellcheck="false">
                </div>

                <label class="label" for="km-run">Odometer (km)</label>
                <input id="km-run" class="text-field" type="number" placeholder="45,000" min="0" max="999999">

                <label class="label" for="owner-count">Ownership (optional)</label>
                <select id="owner-count" class="text-field" style="cursor:pointer">
                    <option value="">Auto-detect from RC</option>
                    <option value="1">1st Owner</option>
                    <option value="2">2nd Owner</option>
                    <option value="3">3rd Owner</option>
                    <option value="4">4th Owner+</option>
                </select>

                <button id="valuate-btn" class="cta" onclick="submitValuation()">
                    <span class="cta-label">Get Valuation</span>
                    <span class="cta-loading" style="display:none">
                        <span class="dot-loader"></span>
                        <span id="loading-msg">Reading registration details</span>
                    </span>
                </button>
            </div>
        </section>

        <!-- Error -->
        <div id="error-box" class="error-box" style="display:none">
            <p id="error-msg"></p>
        </div>

        <!-- Results -->
        <section id="results" style="display:none">
            <button id="back-btn-top" class="back-btn" onclick="goBack()" type="button" aria-label="Back to search">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                <span>Back to search</span>
            </button>

            <!-- Vehicle -->
            <div class="card vehicle-card">
                <h2 id="vehicle-title" class="vehicle-title">—</h2>
                <div class="tags" id="vehicle-meta"></div>
                <span class="match-pill" id="confidence-badge">—</span>
            </div>

            <!-- Price hero -->
            <div class="card price-card">
                <div class="price-hero">
                    <span class="price-currency">₹</span>
                    <span class="price-number" id="price-number">0.00</span>
                    <span class="price-unit">Lakh</span>
                </div>
                <p class="price-label">Estimated market value</p>

                <div class="range-track-wrap">
                    <div class="range-track">
                        <div class="range-fill" id="range-fill"></div>
                        <div class="range-dot" id="range-dot"></div>
                    </div>
                    <div class="range-ends">
                        <span id="range-low">—</span>
                        <span id="range-high">—</span>
                    </div>
                </div>
            </div>

            <!-- Breakdown -->
            <div class="card">
                <h3 class="section-title">How we got this number</h3>
                <div id="adjustment-grid"></div>
            </div>

            <!-- Depreciation divergence note (only shown when divergence > 25%) -->
            <p class="cc-simple-note" id="cross-check-card" style="display:none"></p>

            <!-- Notices -->
            <div class="card card-alert" id="flags-card" style="display:none">
                <h3 class="section-title">Notices</h3>
                <div id="flags-list"></div>
            </div>

            <div class="results-actions">
                <button id="back-btn-bottom" class="back-btn" onclick="goBack()" type="button">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                    <span>Back to search</span>
                </button>
            </div>

            <p class="fine-print" id="disclaimer"></p>
        </section>
    </main>

    <footer class="footer">
        <p>Estimates based on current listings. Not a certified appraisal.</p>
    </footer>
</div>

<script src="app_v4.js"></script>
</body>
</html>
